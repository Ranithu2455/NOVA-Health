<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <style>
	.box { fill: #f8f9fa; stroke: #334155; stroke-width:1.5 }
	.title { font: bold 14px sans-serif; fill: #0f172a }
	.field { font: 12px monospace; fill: #0f172a }
	.pk { font-weight: bold }
	.fk { font-style: italic }
	.line { stroke: #0f172a; stroke-width:1.2 }
	.label { font: 12px sans-serif; fill: #0f172a }
  </style>

  <!-- User box (left) -->
  <rect class="box" x="40" y="60" width="300" height="160" rx="6" ry="6" />
  <text class="title" x="60" y="86">USER</text>
  <text class="field pk" x="60" y="106">UserId (PK)</text>
  <text class="field" x="60" y="122">Email</text>
  <text class="field" x="60" y="138">PasswordHash</text>
  <text class="field" x="60" y="154">Role</text>
  <text class="field" x="60" y="170">CreatedAt, UpdatedAt</text>

  <!-- Profile box -->
  <rect class="box" x="420" y="40" width="360" height="160" rx="6" ry="6" />
  <text class="title" x="440" y="66">PROFILE</text>
  <text class="field pk" x="440" y="86">ProfileId (PK)</text>
  <text class="field fk" x="440" y="102">UserId (FK)</text>
  <text class="field" x="440" y="118">FirstName, LastName</text>
  <text class="field" x="440" y="134">DateOfBirth, Gender</text>
  <text class="field" x="440" y="150">Height, Weight, BloodGroup</text>

  <!-- Medication box -->
  <rect class="box" x="420" y="220" width="360" height="140" rx="6" ry="6" />
  <text class="title" x="440" y="246">MEDICATION</text>
  <text class="field pk" x="440" y="264">MedicationId (PK)</text>
  <text class="field fk" x="440" y="280">UserId (FK)</text>
  <text class="field" x="440" y="296">Name, Dosage, Frequency</text>
  <text class="field" x="440" y="312">StartDate, EndDate, Notes</text>

  <!-- Symptom box -->
  <rect class="box" x="420" y="380" width="360" height="120" rx="6" ry="6" />
  <text class="title" x="440" y="406">SYMPTOM</text>
  <text class="field pk" x="440" y="424">SymptomId (PK)</text>
  <text class="field fk" x="440" y="440">UserId (FK)</text>
  <text class="field" x="440" y="456">Name, Severity, Description</text>
  <text class="field" x="440" y="472">RecordedAt</text>

  <!-- Sleep box -->
  <rect class="box" x="820" y="40" width="340" height="120" rx="6" ry="6" />
  <text class="title" x="840" y="66">SLEEP</text>
  <text class="field pk" x="840" y="86">SleepId (PK)</text>
  <text class="field fk" x="840" y="102">UserId (FK)</text>
  <text class="field" x="840" y="118">SleepDate, BedTime, WakeTime</text>

  <!-- Mood box -->
  <rect class="box" x="820" y="180" width="340" height="120" rx="6" ry="6" />
  <text class="title" x="840" y="206">MOOD</text>
  <text class="field pk" x="840" y="224">MoodId (PK)</text>
  <text class="field fk" x="840" y="240">UserId (FK)</text>
  <text class="field" x="840" y="256">MoodType, Intensity, Notes</text>

  <!-- Water box -->
  <rect class="box" x="820" y="320" width="340" height="100" rx="6" ry="6" />
  <text class="title" x="840" y="346">WATER</text>
  <text class="field pk" x="840" y="364">WaterId (PK)</text>
  <text class="field fk" x="840" y="380">UserId (FK)</text>
  <text class="field" x="840" y="396">AmountMl, RecordedAt</text>

  <!-- Meal box -->
  <rect class="box" x="420" y="520" width="360" height="140" rx="6" ry="6" />
  <text class="title" x="440" y="546">MEAL</text>
  <text class="field pk" x="440" y="564">MealId (PK)</text>
  <text class="field fk" x="440" y="580">UserId (FK)</text>
  <text class="field" x="440" y="596">MealType, FoodName, Calories</text>
  <text class="field" x="440" y="612">Protein, Carbohydrates, Fat, RecordedAt</text>

  <!-- Report box -->
  <rect class="box" x="820" y="460" width="340" height="140" rx="6" ry="6" />
  <text class="title" x="840" y="486">REPORT</text>
  <text class="field pk" x="840" y="504">ReportId (PK)</text>
  <text class="field fk" x="840" y="520">UserId (FK)</text>
  <text class="field" x="840" y="536">ReportType, Title</text>
  <text class="field" x="840" y="552">FileUrl, ReportDate, CreatedAt</text>

  <!-- EmergencyContact box -->
  <rect class="box" x="820" y="620" width="340" height="120" rx="6" ry="6" />
  <text class="title" x="840" y="646">EMERGENCYCONTACT</text>
  <text class="field pk" x="840" y="664">EmergencyContactId (PK)</text>
  <text class="field fk" x="840" y="680">UserId (FK)</text>
  <text class="field" x="840" y="696">Name, Relationship, PhoneNumber</text>
  <text class="field" x="840" y="712">Email, Priority</text>

  <!-- Lines from USER to others -->
  <line class="line" x1="340" y1="140" x2="420" y2="120" />
  <text class="label" x="360" y="128">1:1</text>

  <line class="line" x1="340" y1="160" x2="420" y2="240" />
  <text class="label" x="360" y="200">1:N</text>

  <line class="line" x1="340" y1="170" x2="420" y2="400" />
  <line class="line" x1="340" y1="180" x2="820" y2="80" />
  <line class="line" x1="340" y1="190" x2="820" y2="200" />
  <line class="line" x1="340" y1="200" x2="820" y2="340" />
  <line class="line" x1="340" y1="210" x2="440" y2="580" />
  <line class="line" x1="340" y1="220" x2="820" y2="520" />
  <line class="line" x1="340" y1="230" x2="820" y2="680" />

  <!-- Legend -->
  <rect x="40" y="760" width="1120" height="120" rx="6" ry="6" fill="#ffffff" stroke="#e2e8f0" />
  <text class="label" x="60" y="784">Legend:</text>
  <text class="field" x="60" y="804">PK = Primary Key (unique identifier)</text>
  <text class="field" x="60" y="820">FK = Foreign Key (references USER.UserId)</text>
  <text class="field" x="60" y="836">Boxes and relationships reflect the EF Core models and ApplicationDbContext in the repository.</text>

</svg>